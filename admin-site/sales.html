<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales records - LOK Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="sales">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1>Sales records</h1>
        <span class="muted" id="summary"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Sold on</th><th>Property</th><th>Buyer</th><th>Contact</th><th>Listed price</th><th>Sale price</th></tr>
          </thead>
          <tbody id="salesBody"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
