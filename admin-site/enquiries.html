<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquiries - LOK Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="enquiries">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1>Enquiries</h1>
        <span class="muted" id="count"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Property</th><th>Message</th><th></th></tr></thead>
          <tbody id="enquiryBody"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/enquiries.js"></script>
</body>
</html>
